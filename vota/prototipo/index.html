#nyanime-rinascita { width:100%; }
#nyanime-rinascita .nr-caption {font:12px/1.5 system-ui,sans-serif;opacity:.7;margin:0 0 12px;text-align:center;}
#nyanime-rinascita .nr-stage {display:flex;justify-content:center;align-items:flex-start;padding:22px 12px 38px;min-height:1350px;box-sizing:border-box;}
#nyanime-rinascita .nr-phone {
  --nr-bg:light-dark(#faf8f5,#0a0a0d);--nr-surface:light-dark(#fff,#141418);--nr-raised:light-dark(#f1ede9,#1c1c22);--nr-line:light-dark(#e5dfd9,#303038);--nr-text:light-dark(#201c1b,#f6f4f5);--nr-muted:light-dark(#746d69,#a9a5ae);--nr-accent:light-dark(#c95118,#ff3155);--nr-on-accent:light-dark(#fff,#fff);--nr-soft:light-dark(#fbe7db,#35151f);--nr-positive:light-dark(#237548,#73c89b);--nr-cool:light-dark(#25769c,#75c5df);--nr-gold:light-dark(#9f6c18,#e4ba75);
  --nr-type:1;--nr-radius:23px;
  width:100%;max-width:414px;min-height:1060px;position:relative;isolation:isolate;background:var(--nr-bg);color:var(--nr-text);border:1px solid var(--nr-line);border-radius:32px;box-shadow:0 24px 80px #0002;font:calc(14px * var(--nr-type))/1.5 NRManrope,system-ui,sans-serif;box-sizing:border-box;
}
#nyanime-rinascita .nr-phone[data-theme="dark"] {color-scheme:dark;}
#nyanime-rinascita .nr-phone[data-theme="light"] {color-scheme:light;}
#nyanime-rinascita .nr-phone * {box-sizing:border-box;}
#nyanime-rinascita .nr-phone button,#nyanime-rinascita .nr-phone input,#nyanime-rinascita .nr-phone textarea,#nyanime-rinascita .nr-phone select {font:inherit;}
#nyanime-rinascita .nr-phone button {color:inherit;background:none;border:0;padding:0;touch-action:manipulation;}
#nyanime-rinascita .nr-phone button:focus-visible {outline:2px solid var(--nr-accent);outline-offset:3px;}
#nyanime-rinascita .nr-phone button:active {opacity:.72;}
#nyanime-rinascita .nr-phone button[disabled] {opacity:.45;}
#nyanime-rinascita .nr-phone svg {width:19px;height:19px;flex-shrink:0;stroke-width:1.8;}
#nyanime-rinascita .nr-status {display:flex;justify-content:space-between;padding:15px 24px 5px;font-size:12px;font-weight:700;letter-spacing:.02em;}
#nyanime-rinascita .nr-status span:last-child {display:flex;gap:6px;align-items:center;}
#nyanime-rinascita .nr-status svg {width:13px;height:13px;}
#nyanime-rinascita .nr-toolbar {display:flex;gap:5px;align-items:center;padding:8px 15px;position:relative;z-index:2;}
#nyanime-rinascita .nr-toolbar .nr-back {display:flex;align-items:center;gap:7px;min-height:44px;padding:0 6px;font-size:12px;font-weight:650;}
#nyanime-rinascita .nr-spacer {flex:1;}
#nyanime-rinascita .nr-icon {width:44px;min-height:44px;display:inline-flex;justify-content:center;align-items:center;border-radius:50%;}
#nyanime-rinascita .nr-icon:hover {background:var(--nr-raised);}
#nyanime-rinascita .nr-muted {color:var(--nr-muted);}
#nyanime-rinascita .nr-small {font-size:12px;line-height:1.5;}
#nyanime-rinascita .nr-overline {font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:var(--nr-muted);}
#nyanime-rinascita .nr-section {padding:0 22px;}
#nyanime-rinascita .nr-heading {display:flex;align-items:center;gap:8px;margin:22px 0 12px;}
#nyanime-rinascita .nr-heading h2 {font:750 17px/1.3 inherit;font-size:17px;line-height:1.3;font-weight:750;margin:0;letter-spacing:-.04em;}
#nyanime-rinascita .nr-heading .nr-small {margin-left:auto;}
#nyanime-rinascita .nr-heading button {margin-left:auto;color:var(--nr-accent);font-size:12px;min-height:44px;}
#nyanime-rinascita .nr-hero {position:relative;padding:18px 22px 10px;}
#nyanime-rinascita .nr-ambience {position:absolute;inset:-125px 0 42%;z-index:-1;overflow:hidden;border-radius:0 0 35px 35px;pointer-events:none;}
#nyanime-rinascita .nr-ambience img {width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:blur(20px) saturate(.65);opacity:.34;transform:scale(1.18);}
#nyanime-rinascita .nr-ambience:after {content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--nr-bg) 0%,transparent 30%,var(--nr-bg) 100%);}
#nyanime-rinascita .nr-identity {display:grid;grid-template-columns:102px 1fr;gap:18px;align-items:end;}
#nyanime-rinascita .nr-poster {display:block;position:relative;width:100%;aspect-ratio:2/2.85;border-radius:12px;overflow:hidden;box-shadow:0 10px 26px #0003;}
#nyanime-rinascita .nr-poster img {display:block;width:100%;height:100%;object-fit:cover;}
#nyanime-rinascita .nr-title h1 {font-size:27px;line-height:1.13;font-weight:750;letter-spacing:-.065em;margin:7px 0 9px;overflow-wrap:anywhere;}
#nyanime-rinascita .nr-title p {font-size:12px;color:var(--nr-muted);margin:0 0 8px;line-height:1.5;}
#nyanime-rinascita .nr-catalog {display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;}
#nyanime-rinascita .nr-catalog svg {width:13px;height:13px;color:var(--nr-gold);fill:color-mix(in srgb,var(--nr-gold) 18%,transparent);}
#nyanime-rinascita .nr-catalog strong {font-weight:750;}
#nyanime-rinascita .nr-genres {display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 0;font-size:11px;letter-spacing:.01em;color:var(--nr-muted);}
#nyanime-rinascita .nr-genres span {border-bottom:1px solid var(--nr-line);padding-bottom:3px;}
#nyanime-rinascita .nr-source {display:flex;width:100%;align-items:center;gap:8px;font-size:12px;min-height:45px;color:var(--nr-muted);text-align:left;}
#nyanime-rinascita .nr-source svg:first-child {width:14px;height:14px;}
#nyanime-rinascita .nr-source span {min-width:0;flex:1;}
#nyanime-rinascita .nr-source svg:last-child {width:14px;height:14px;}
#nyanime-rinascita .nr-resume {display:flex;align-items:center;gap:12px;padding:15px 17px!important;background:var(--nr-accent)!important;color:var(--nr-on-accent)!important;border-radius:18px;width:100%;min-height:72px;text-align:left;box-shadow:0 8px 25px color-mix(in srgb,var(--nr-accent) 14%,transparent);}
#nyanime-rinascita .nr-resume>svg {width:23px;height:23px;fill:currentColor;stroke-width:0;}
#nyanime-rinascita .nr-resume .nr-resume-text {flex:1;min-width:0;}
#nyanime-rinascita .nr-resume strong {display:block;font-size:14px;font-weight:750;}
#nyanime-rinascita .nr-resume small {font-size:12px;opacity:.8;}
#nyanime-rinascita .nr-resume .nr-resume-end {font-size:11px;opacity:.85;}
#nyanime-rinascita .nr-quick {display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
#nyanime-rinascita .nr-quick button {min-height:48px;border-radius:13px;border:1px solid var(--nr-line);display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:650;}
#nyanime-rinascita .nr-quick button.is-on {background:var(--nr-raised);border-color:transparent;}
#nyanime-rinascita .nr-quick svg {width:16px;height:16px;}
#nyanime-rinascita .nr-personal {display:flex;gap:9px;align-items:center;padding:15px 0 17px;margin-top:1px;border-bottom:1px solid var(--nr-line);width:100%;text-align:left;}
#nyanime-rinascita .nr-dot {width:6px;height:6px;background:var(--nr-positive);border-radius:100%;display:inline-block;flex-shrink:0;}
#nyanime-rinascita .nr-personal-label {font-size:12px;flex:1;}
#nyanime-rinascita .nr-personal-label strong {display:block;font-size:12px;font-weight:650;}
#nyanime-rinascita .nr-personal-progress {min-width:68px;text-align:right;font-size:12px;font-weight:750;}
#nyanime-rinascita .nr-meter {display:block;width:100%;height:3px;border-radius:3px;background:var(--nr-raised);margin-top:6px;overflow:hidden;}
#nyanime-rinascita .nr-meter>span {display:block;height:100%;border-radius:3px;background:var(--nr-accent);}
#nyanime-rinascita .nr-tabbar {display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--nr-line);margin:8px 22px 0;}
#nyanime-rinascita .nr-tabbar button {min-height:48px;color:var(--nr-muted);font-size:12px;position:relative;}
#nyanime-rinascita .nr-tabbar button[aria-selected=true] {color:var(--nr-text);font-weight:750;}
#nyanime-rinascita .nr-tabbar button[aria-selected=true]:after {content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:3px;background:var(--nr-accent);border-radius:3px;}
#nyanime-rinascita .nr-content {padding:0 22px 26px;min-height:465px;animation:nr-fade .18s ease-out both;}
#nyanime-rinascita .nr-scope {display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
#nyanime-rinascita .nr-chip {min-height:34px;padding:5px 11px!important;border-radius:11px;font-size:12px!important;background:var(--nr-raised)!important;color:var(--nr-muted)!important;display:inline-flex;gap:6px;align-items:center;justify-content:center;}
#nyanime-rinascita .nr-chip[aria-pressed=true] {color:var(--nr-accent)!important;background:var(--nr-soft)!important;font-weight:700;}
#nyanime-rinascita .nr-chip svg {width:14px;height:14px;}
#nyanime-rinascita .nr-episode {display:flex;width:100%;gap:12px;align-items:center;padding:14px 0!important;text-align:left;min-height:72px;border-bottom:1px solid color-mix(in srgb,var(--nr-line) 65%,transparent)!important;}
#nyanime-rinascita .nr-episode.is-current {background:var(--nr-surface)!important;padding:14px 12px!important;border:1px solid var(--nr-line)!important;border-radius:15px;margin:6px 0;}
#nyanime-rinascita .nr-episode-n {width:32px;text-align:center;font-size:15px;font-weight:650;color:var(--nr-muted);flex-shrink:0;}
#nyanime-rinascita .nr-episode.is-current .nr-episode-n {color:var(--nr-accent);}
#nyanime-rinascita .nr-episode-title {min-width:0;flex:1;}
#nyanime-rinascita .nr-episode-title strong {font-size:12px;display:block;font-weight:650;}
#nyanime-rinascita .nr-episode-title small {font-size:11px;display:block;color:var(--nr-muted);margin-top:3px;}
#nyanime-rinascita .nr-episode-end {width:26px;color:var(--nr-muted);display:flex;justify-content:center;}
#nyanime-rinascita .nr-episode-end svg {width:17px;height:17px;}
#nyanime-rinascita .nr-episode.is-current .nr-episode-end {color:var(--nr-accent);}
#nyanime-rinascita .nr-footer-hint {font-size:11px;color:var(--nr-muted);text-align:center;margin:15px 0 0;}
#nyanime-rinascita .nr-text-link {color:var(--nr-accent)!important;font-weight:650;min-height:44px;font-size:12px!important;}
#nyanime-rinascita .nr-synopsis {font-size:12px;color:var(--nr-muted);line-height:1.8;margin:0;}
#nyanime-rinascita .nr-feature {display:flex;gap:13px;align-items:center;width:100%;padding:16px 0!important;min-height:68px;text-align:left;border-bottom:1px solid var(--nr-line)!important;}
#nyanime-rinascita .nr-feature>svg:first-child {color:var(--nr-muted);}

      const t=e.target.closest('button');if(!t||!p.contains(t))return;

      if(a==='tracking-status'){mutateTracking(p,()=>s.personalStatus=t.dataset.value);return;}
      if(a==='progress-plus'||a==='progress-minus'){mutateTracking(p,()=>s.progress=Math.max(0,Math.min(d.total,s.progress+(a==='progress-plus'?1:-1))));return;}
      if(a==='score'){mutateTracking(p,()=>s.score=Number(t.dataset.value));return;}
      if(a==='undo-tracking'){if(s.undo){Object.assign(s,s.undo);s.undo=null;overlay(p);const old=p.querySelector('.nr-personal');if(old)old.outerHTML=personal(p);refreshIcons();toast(p,'Ultima modifica annullata');}return;}

      if(a==='library-medium'){s.libraryMedium=t.dataset.value;draw(p);return;}

  function applySettings(){for(const p of models.keys()){const s=state(p);p.dataset.theme=settings.theme;p.style.setProperty('--nr-type',settings.text==='Grande'?'1.13':'1');if(s.medium!==settings.medium){s.medium=settings.medium;s.progress=data[s.medium].completed;s.personalStatus='';s.note='';s.sheet=null;draw(p);}else if(p.dataset.offline!==String(settings.offline))draw(p);}persist();}
  root.setPreview=changes=>{Object.assign(settings,changes);applySettings();};
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applySettings});tweak.addSelect(settings,'medium',{label:'Opera di esempio',options:[{label:'Anime · La rotta delle stelle',value:'anime'},{label:'Manga · Oltre il vento',value:'manga'}]});tweak.addSelect(settings,'theme',{label:'Aspetto',options:[{label:'Segui il sistema',value:'system'},{label:'Scuro · rosso',value:'dark'},{label:'Chiaro · arancione',value:'light'}]});tweak.addSelect(settings,'text',{label:'Testi',options:['Normale','Grande']});tweak.addToggle(settings,'offline',{label:'Simula offline'});}
})();
</script>

<style>
html{color-scheme:dark;background:transparent}body{margin:0;background:transparent}*,*::before,*::after{box-sizing:border-box}
.nr-caption{display:none!important}.nr-stage{min-height:0!important;padding:0!important;display:flex;justify-content:center}
[data-variant][hidden]{display:none!important}#nyanime-rinascita .nr-phone{width:100%;max-width:414px;min-height:0!important}
button{cursor:pointer}.viz-carousel{padding:0!important;margin:0!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script>
(()=>{
 const root=document.getElementById('nyanime-rinascita');
 let current='ritmo',view='detail';
 function select(d){for(const section of document.querySelectorAll('[data-variant]'))section.hidden=section.querySelector('.nr-phone').dataset.design!==d;current=d;}
 function height(){const p=document.querySelector('[data-design="'+current+'"]');if(p)parent.postMessage({type:'nyanime-preview-size',height:Math.ceil(p.getBoundingClientRect().height)},location.origin);}
 function update(data){
  if(!['ritmo','copertina','taccuino'].includes(data.design))return;
  select(data.design);root.setPreview({medium:data.medium==='manga'?'manga':'anime',theme:data.theme==='light'?'light':'dark',text:'Normale'});
  const p=root.querySelector('[data-design="'+current+'"]');
  if(data.screen==='library'&&!p.querySelector('.nr-library-header'))p.querySelector('[data-action="library"]')?.click();
  if(data.screen==='detail'&&p.querySelector('.nr-library-header'))p.querySelector('[data-action="open-title"][data-medium="'+(data.medium==='manga'?'manga':'anime')+'"]')?.click();
  view=data.screen;lucide.createIcons({attrs:{width:19,height:19}});requestAnimationFrame(height);
 }
 select(new URLSearchParams(location.search).get('design')||'ritmo');
 root.setPreview({theme:'dark',medium:'anime',text:'Normale'});lucide.createIcons({attrs:{width:19,height:19}});
 addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='nyanime-preview')update(e.data);});
 new ResizeObserver(height).observe(root);root.addEventListener('click',()=>requestAnimationFrame(height));
 document.fonts.ready.then(height);
})();
</script></body></html>
