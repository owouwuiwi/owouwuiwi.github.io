<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">

<body class="open-page">
  <header class="header">
    <a href="/" class="brand" aria-label="Nyanime, Home"><img class="logo dark-logo" src="/assets/logo-dark.svg" width="164" height="40" alt="Nyanime"><img class="logo light-logo" src="/assets/logo-light.svg" width="164" height="40" alt="Nyanime"></a>
    <nav aria-label="Navigation"><a href="/#download" class="nav-download">Get the app <span aria-hidden="true">↗</span></a><button class="theme-button" aria-label="Switch to light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></nav>

  <main>
    <section class="open-card">
      <img class="open-icon" src="/assets/mark.svg" width="62" height="62" alt="">
      <p class="eyebrow">A room shared with you</p>
      <h1 id="room-title">Join the room.</h1>
      <p id="room-help">Join your friends in Nyanime. The host needs to approve your request.</p>
      <p class="open-meta room-code" id="room-code" aria-label="Room code"></p>
      <a class="button primary hidden" id="join-room" href="#">Open in Nyanime <span aria-hidden="true">↗</span></a>
      <button class="button secondary hidden" id="copy-room" type="button">Copy room code</button>
      <p class="open-help" id="room-fallback">You can also open Watch together in the app and enter the eight-digit code.</p>
      <p class="open-status" id="room-status" role="status" aria-live="polite"></p>
      <noscript><p>Open Watch together in Nyanime and type the eight digits after # in this page’s address.</p></noscript>
      <a class="text-link" href="/#download">Get Nyanime <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <footer class="footer wrap"><p>Watch. Read. Together.</p><div><a href="/">Home</a><a href="https://github.com/owouwuiwi/nyanime/blob/main/docs/watch-together.md">Room guide</a></div></footer>
